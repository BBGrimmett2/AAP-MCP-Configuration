apiVersion: v1
kind: ConfigMap
metadata:
  name: aap-mcp-custom-config
  namespace: aap-operator
data:
  aap-mcp.yaml: |
    ---
    # Read-Only AAP MCP Server Configuration
    # All write operations (create, update, destroy, delete, patch) are disabled
    # Only query, list, and retrieve operations are available

    services:
      - name: controller
        local_path: data/controller-schema.json
      - name: galaxy
        local_path: data/galaxy-openapi.json
      - name: gateway
        local_path: data/gateway-schema.json
      - name: eda
        local_path: data/eda-openapi.json
      - name: lightspeed
        local_path: data/lightspeed.json

    toolsets:
      # Job management (read-only)
      job_management:
        - controller.job_templates_list
        - controller.job_templates_retrieve
        - controller.workflow_job_templates_list
        - controller.workflow_job_templates_retrieve
        - controller.job_templates_launch_retrieve
        - controller.jobs_list
        - controller.jobs_retrieve
        - controller.workflow_jobs_list
        - controller.workflow_jobs_retrieve
        - controller.jobs_stdout_retrieve
        - controller.jobs_job_events_list
        - controller.jobs_job_host_summaries_list
        - controller.workflow_jobs_workflow_nodes_list
        - controller.jobs_relaunch_retrieve
        - controller.ad_hoc_commands_list
        - controller.ad_hoc_commands_retrieve
        - controller.ad_hoc_commands_stdout_retrieve
        - controller.ad_hoc_commands_events_list
        - controller.ad_hoc_commands_relaunch_retrieve
        - controller.projects_list
        - controller.job_templates_credentials_list
        - controller.unified_job_templates_list
        - controller.projects_playbooks_retrieve
        - controller.workflow_job_template_nodes_credentials_list
        - controller.analytics_retrieve
        - controller.metrics_retrieve
        - eda.activation_instances_list
        - eda.activation_instances_logs_list

      # Inventory management (read-only)
      inventory_management:
        - controller.inventories_list
        - controller.inventories_inventory_sources_list
        - controller.hosts_list
        - controller.hosts_retrieve
        - controller.hosts_variable_data_retrieve
        - controller.hosts_ansible_facts_retrieve
        - controller.groups_list
        - controller.inventory_sources_list

      # System monitoring (read-only)
      system_monitoring:
        - controller.instance_groups_list
        - controller.instance_groups_retrieve
        - controller.instances_retrieve
        - controller.mesh_visualizer_retrieve
        - gateway.activitystream_list
        - gateway.activitystream_retrieve
        - gateway.authenticators_list
        - controller.activity_stream_list
        - controller.activity_stream_retrieve
        - gateway.status_retrieve
        - gateway.feature_flags_state_retrieve

      # Security & compliance (read-only)
      security_compliance:
        - controller.credentials_list
        - controller.credentials_retrieve
        - controller.credential_types_list
        - controller.credential_types_retrieve
        - controller.job_templates_credentials_list
        - controller.credential_input_sources_list
        - controller.jobs_list
        - gateway.activitystream_list
        - controller.activity_stream_list

      # Content discovery (read-only)
      content_discovery:
        - galaxy.ansible_content_collections_index
        - galaxy.ansible_content_collections_index_versions_get_distro_base_pa
        - galaxy.execution_environments_repositories_get_repositories
        - lightspeed.aap_rag_search
